name: CI

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests, linting, and type checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,nwb]"

      - name: Run tests
        env:
          PYNWB_NO_CACHE_DIR: "1"
        run: pytest

      - name: Run Ruff
        run: ruff check src/ tests/

      - name: Run mypy
        run: mypy src/
